
<!-- TOOLBOX ONLINE - TEXT TOOLS SECTION -->
<section id="text-tools" class="text-tools-section">
  <h2>✍️ Text Tools</h2>
  <p class="text-tools-subtitle">Free tools to edit, clean and transform text.</p>

  <div class="text-tool-card">
    <h3>📝 Text Editor</h3>
    <textarea id="txtInput" placeholder="Type or paste your text here..."></textarea>

    <div class="text-tool-buttons">
      <button onclick="txtCount()">Word Count</button>
      <button onclick="txtCase('upper')">UPPERCASE</button>
      <button onclick="txtCase('lower')">lowercase</button>
      <button onclick="txtCase('title')">Title Case</button>
      <button onclick="txtCase('sentence')">Sentence case</button>
      <button onclick="txtClean()">Clean Text</button>
      <button onclick="txtReverse()">Reverse Text</button>
      <button onclick="txtUnique()">Remove Duplicate Lines</button>
      <button onclick="txtSlug()">Create Slug</button>
      <button onclick="txtSpell()">Spelling Helper</button>
      <button onclick="txtCopy()">Copy Result</button>
      <button onclick="txtClear()">Clear All</button>
    </div>

    <div id="txtStats" class="text-tool-stats">Words: 0 | Characters: 0 | Sentences: 0 | Lines: 0</div>

    <label for="txtOutput">Result</label>
    <textarea id="txtOutput" placeholder="Your result will appear here..." readonly></textarea>
    <div id="txtMessage" role="status" aria-live="polite"></div>
  </div>
</section>

<style>
.text-tools-section {
  max-width: 1000px;
  margin: 35px auto;
  padding: 20px;
  color: var(--text, #f5f5ff);
  font-family: Arial, sans-serif;
}
.text-tools-section h2 {
  font-size: 28px;
  margin-bottom: 8px;
}
.text-tools-subtitle {
  color: var(--muted, #aaaac0);
  margin-bottom: 20px;
}
.text-tool-card {
  background: var(--card, #11111f);
  border: 1px solid var(--border, #292940);
  border-radius: 16px;
  padding: 20px;
}
.text-tool-card h3 {
  margin: 0 0 14px;
}
.text-tool-card textarea {
  display: block;
  width: 100%;
  min-height: 150px;
  resize: vertical;
  padding: 14px;
  margin: 12px 0;
  box-sizing: border-box;
  border-radius: 10px;
  border: 1px solid var(--border, #393950);
  background: var(--input, #080812);
  color: var(--text, #fff);
  font: inherit;
  line-height: 1.6;
}
.text-tool-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin: 14px 0;
}
.text-tool-buttons button {
  border: 0;
  border-radius: 8px;
  padding: 10px 13px;
  background: var(--primary, #7c3cff);
  color: white;
  cursor: pointer;
  font-weight: 600;
}
.text-tool-buttons button:hover {
  filter: brightness(1.15);
}
.text-tool-stats {
  padding: 12px;
  margin: 12px 0;
  border-radius: 8px;
  background: var(--card2, #18182a);
  color: var(--cyan, #00d9ff);
  overflow-wrap: anywhere;
}
#txtMessage {
  margin-top: 10px;
  min-height: 20px;
  color: var(--cyan, #00d9ff);
}
@media (max-width: 600px) {
  .text-tools-section { padding: 12px; }
  .text-tool-card { padding: 13px; }
  .text-tool-buttons button { flex: 1 1 42%; }
}
</style>

<script>
(function () {
  const input = document.getElementById("txtInput");
  const output = document.getElementById("txtOutput");
  const stats = document.getElementById("txtStats");
  const message = document.getElementById("txtMessage");

  if (!input || !output || !stats || !message) return;

  function say(text) {
    message.textContent = text;
  }

  function getText() {
    return input.value;
  }

  function setResult(text, notice) {
    output.value = text;
    updateStats();
    say(notice || "Done!");
  }

  function updateStats() {
    const text = getText();
    const trimmed = text.trim();
    const words = trimmed ? trimmed.split(/\s+/u).length : 0;
    const sentences = trimmed
      ? (trimmed.match(/[^.!?]+[.!?]*/gu) || []).filter(s => s.trim()).length
      : 0;
    const lines = text ? text.split(/\r\n|\r|\n/u).length : 0;

    stats.textContent =
      "Words: " + words +
      " | Characters: " + text.length +
      " | Characters (no spaces): " + text.replace(/\s/gu, "").length +
      " | Sentences: " + sentences +
      " | Lines: " + lines;
  }

  window.txtCount = function () {
    output.value = getText();
    updateStats();
    say("Word count updated.");
  };

  window.txtCase = function (type) {
    const text = getText();
    let result = text;

    if (type === "upper") result = text.toUpperCase();
    if (type === "lower") result = text.toLowerCase();

    if (type === "title") {
      result = text.toLowerCase().replace(
        /(^|[\s([{—-])(\p{L})/gu,
        (match, before, letter) => before + letter.toUpperCase()
      );
    }

    if (type === "sentence") {
      result = text.toLowerCase().replace(
        /(^\s*\p{L}|[.!?]\s+\p{L})/gu,
        match => match.toUpperCase()
      );
    }

    setResult(result, "Text case converted.");
  };

  window.txtClean = function () {
    const result = getText()
      .replace(/\r\n?/gu, "\n")
      .replace(/[ \t]+/gu, " ")
      .replace(/ *\n */gu, "\n")
      .replace(/\n{3,}/gu, "\n\n")
      .trim();

    setResult(result, "Extra spaces and blank lines cleaned.");
  };

  window.txtReverse = function () {
    const result = Array.from(getText()).reverse().join("");
    setResult(result, "Text reversed.");
  };

  window.txtUnique = function () {
    const seen = new Set();
    const result = getText()
      .split(/\r\n|\r|\n/u)
      .filter(line => {
        const key = line.trim();
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      })
      .join("\n");

    setResult(result, "Duplicate lines removed.");
  };

  window.txtSlug = function () {
    const result = getText()
      .normalize("NFKD")
      .replace(/[\u0300-\u036f]/gu, "")
      .toLowerCase()
      .trim()
      .replace(/[^a-z0-9]+/gu, "-")
      .replace(/^-+|-+$/gu, "");

    setResult(result, "Slug created.");
  };

  window.txtSpell = function () {
    const corrections = {
      teh: "the",
      recieve: "receive",
      beleive: "believe",
      seperate: "separate",
      definately: "definitely",
      occurrance: "occurrence",
      accomodate: "accommodate",
      adress: "address",
      becuase: "because",
      freind: "friend",
      thier: "their",
      wich: "which",
      goverment: "government",
      enviroment: "environment",
      langauge: "language"
    };

    const result = getText().replace(/\b[a-z]+\b/giu, word => {
      const correction = corrections[word.toLowerCase()];
      if (!correction) return word;
      return word[0] === word[0].toUpperCase()
        ? correction[0].toUpperCase() + correction.slice(1)
        : correction;
    });

    setResult(
      result,
      "Basic spelling suggestions applied. This is not a full spell checker."
    );
  };

  window.txtCopy = async function () {
    if (!output.value) {
      say("There is no result to copy.");
      return;
    }

    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(output.value);
      } else {
        output.focus();
        output.select();
        const copied = document.execCommand("copy");
        if (!copied) throw new Error("Copy unavailable");
      }
      say("Result copied!");
    } catch (error) {
      output.focus();
      output.select();
      say("Text selected. Press Ctrl+C to copy.");
    }
  };

  window.txtClear = function () {
    input.value = "";
    output.value = "";
    updateStats();
    say("Text cleared.");
    input.focus();
  };

  input.addEventListener("input", updateStats);
  updateStats();
})();
</script>
